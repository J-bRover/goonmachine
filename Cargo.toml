[package]
name = "rico-32"
version = "0.3.0"
edition = "2021"
description = "A simple VM console with a game engine and scripting language"
license = "MIT"
repository = "https://github.com/RICO-32/RICO-32"
default-run = "rico-32"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
macro_procs = { path = "./macro_procs", version = "0.1.0" }
winit = "0.28"
pixels = "0.12"
mlua = {version = "0.11.4", features = ["lua54", "vendored"] }
rayon = "1.11.0"
bincode = "2.0.1"
walkdir = "2.5.0"
flate2 = "1.1.5"
base64 = "0.22.1"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
image = "0.25.9"
